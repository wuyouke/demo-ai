<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
        }
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #667eea;
        }
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .info {
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .clear-btn {
            background: #ff6b6b;
            margin-left: 10px;
            padding: 12px 20px;
        }
        .clear-btn:hover {
            background: #ee5a5a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🤖 AI 对话助手</h1>
                    <p>支持天气查询、旅游景点推荐 | 多轮对话 | 上下文记忆</p>
                </div>
                <div style="text-align: right; font-size: 14px;">
                    <div id="userInfo">用户: <span id="username">未登陆</span></div>
                    <button onclick="logout()" style="margin-top: 10px; padding: 8px 15px; background: rgba(255,255,255,0.3); border: 1px solid white;">登出</button>
                </div>
            </div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
                <button class="clear-btn" onclick="clearChat()">清空</button>
            </div>
        </div>
        <div class="info" id="info">会话 ID: 新会话</div>
    </div>

    <script>
        let sessionId = null;
        let userId = null;
        let token = null;
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const info = document.getElementById('info');

        // 检查认证状态
        window.addEventListener('load', function() {
            token = localStorage.getItem('token');
            userId = localStorage.getItem('userId');
            const username = localStorage.getItem('username');

            if (!token || !userId) {
                // 未登陆，重定向到登陆页面
                window.location.href = '/index.html';
            } else {
                // 显示用户信息
                document.getElementById('username').textContent = username || '用户';
            }
        });

        function logout() {
            if (confirm('确定要登出吗？')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userId');
                localStorage.removeItem('username');
                window.location.href = '/index.html';
            }
        }

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user' : 'ai');
            messageDiv.innerHTML = '<div class="message-content">' + content + '</div>';
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'loading';
            messageDiv.innerHTML = '<div class="message-content"><span class="loading"></span>思考中...</div>';
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingDiv = document.getElementById('loading');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 显示用户消息
            addMessage(message, true);
            messageInput.value = '';

            // 显示加载状态
            addLoadingMessage();

            try {
                const response = await fetch('/api/conversation/chat/full', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId
                    })
                });

                const data = await response.json();

                removeLoadingMessage();

                if (response.status === 401) {
                    addMessage('❌ 认证失败，请重新登陆', false);
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                } else if (data.success) {
                    addMessage(data.response, false);
                    sessionId = data.sessionId;
                    info.textContent = '会话 ID: ' + sessionId.substring(0, 8) + '...';
                } else {
                    addMessage('❌ ' + data.errorMessage, false);
                }
            } catch (error) {
                removeLoadingMessage();
                addMessage('❌ 请求失败: ' + error.message, false);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function clearChat() {
            if (confirm('确定要清空对话吗？')) {
                chatArea.innerHTML = '';
                sessionId = null;
                info.textContent = '会话 ID: 新会话';
                addMessage('✨ 对话已清空，开始新的对话吧！', false);
            }
        }

        // 欢迎消息
        addMessage('👋 你好！我是 AI 助手，可以帮你查询天气、推荐旅游景点。请问有什么可以帮助你的吗？', false);
    </script>
</body>
</html>
