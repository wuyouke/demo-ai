<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 35px;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .header p {
            font-size: 15px;
            opacity: 0.9;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-content {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
        }
        .message-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .input-area {
            padding: 25px;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: white;
        }
        .image-preview-container {
            display: none;
            position: relative;
            width: fit-content;
        }
        .image-preview {
            max-height: 100px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .remove-image-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .upload-btn {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #eee;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn:hover {
            background: #e9ecef;
            border-color: #ddd;
            transform: translateY(-2px);
        }
        input[type="file"] {
            display: none;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #667eea;
        }
        button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .info {
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .clear-btn {
            background: #ff6b6b;
            margin-left: 10px;
            padding: 12px 20px;
        }
        .clear-btn:hover {
            background: #ee5a5a;
        }
        .voice-btn {
            background: #ff8c42;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .voice-btn:hover {
            background: #ff7a2f;
        }
        .voice-btn.recording {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .voice-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }
        .tts-btn {
            background: #4CAF50;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .tts-btn:hover {
            background: #45a049;
            transform: scale(1.1);
        }
        .persona-selector {
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
            background: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .persona-selector label {
            font-weight: 500;
            color: #333;
            white-space: nowrap;
        }
        .persona-selector select {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #eee;
            border-radius: 18px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            background: white;
            cursor: pointer;
        }
        .persona-selector select:hover {
            border-color: #667eea;
        }
        .persona-selector select:focus {
            border-color: #667eea;
        }
        .persona-info {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            padding: 0 20px;
        }
        .controls-bar {
            padding: 12px 25px;
            border-bottom: 1px solid #eee;
            background: white;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-item label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            background-color: #ccc;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .toggle-switch.active {
            background-color: #667eea;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .toggle-switch.active::after {
            left: 22px;
        }
        .doc-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .doc-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            overflow: auto;
        }
        .modal.show {
            display: block;
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }
        .close-modal {
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            line-height: 1;
        }
        .close-modal:hover {
            color: #333;
        }
        .doc-upload {
            margin-bottom: 15px;
        }
        .doc-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        .doc-item {
            padding: 10px;
            background: #f5f5f5;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .doc-item-name {
            flex: 1;
            color: #333;
            font-weight: 500;
        }
        .doc-item-size {
            color: #999;
            font-size: 12px;
            margin: 0 10px;
        }
        .doc-delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .doc-delete-btn:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🤖 AI 对话助手</h1>
                    <p>支持天气查询、旅游景点推荐 | 多轮对话 | 上下文记忆</p>
                </div>
                <div style="text-align: right; font-size: 14px;">
                    <div id="userInfo">用户: <span id="username">未登陆</span></div>
                    <button onclick="logout()" style="margin-top: 10px; padding: 8px 15px; background: rgba(255,255,255,0.3); border: 1px solid white;">登出</button>
                </div>
            </div>
        </div>
        <div class="persona-selector">
            <label for="personaSelect">🎭 角色:</label>
            <select id="personaSelect" onchange="switchPersona()">
                <option value="">加载中...</option>
            </select>
        </div>
        <div class="persona-info" id="personaInfo"></div>
        <div class="controls-bar">
            <div class="control-item">
                <label>📄 使用 RAG:</label>
                <div class="toggle-switch" id="ragToggle" onclick="toggleRag()"></div>
            </div>
            <button class="doc-btn" onclick="openDocModal()">📁 文档管理</button>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
            <div class="image-preview-container" id="imagePreviewContainer">
                <img id="imagePreview" class="image-preview" src="" alt="Preview">
                <button class="remove-image-btn" onclick="removeImage()">×</button>
            </div>
            <div class="input-group">
                <label class="upload-btn" title="上传图片">
                    📎
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
                </label>
                <button class="voice-btn" id="voiceBtn" title="点击说话" onclick="toggleVoiceInput()">
                    🎤 <span id="voiceStatus">说话</span>
                </button>
                <input type="text" id="messageInput" placeholder="输入消息或点击🎤说话..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
                <button class="clear-btn" onclick="clearChat()">清空</button>
            </div>
        </div>
        <div class="info" id="info">会话 ID: 新会话</div>
    </div>

    <!-- 文档管理模态框 -->
    <div id="docModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📁 文档管理</h2>
                <button class="close-modal" onclick="closeDocModal()">×</button>
            </div>
            <div class="doc-upload">
                <p style="font-size: 13px; color: #666; margin-bottom: 10px;">上传文档用于 RAG 增强对话:</p>
                <label style="display: block; padding: 15px; border: 2px dashed #667eea; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.background='#f5f7ff'" onmouseout="this.style.background='white'">
                    <input type="file" id="docInput" accept=".pdf,.txt,.md,.markdown" onchange="handleDocUpload(event)" style="display: none;">
                    📤 点击或拖拽上传 (PDF, TXT, Markdown)
                </label>
            </div>
            <div style="margin-bottom: 15px;">
                <p style="font-size: 13px; color: #666; margin-bottom: 10px;">已上传的文档:</p>
                <div class="doc-list" id="docList">
                    <p style="text-align: center; color: #999; font-size: 13px; padding: 20px;">加载中...</p>
                </div>
            </div>
            <div style="text-align: right;">
                <button onclick="closeDocModal()" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 18px; cursor: pointer;">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let userId = null;
        let token = null;
        let currentPersonaId = 'assistant'; // 当前选中的角色
        let personas = []; // 所有可用的角色列表
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const info = document.getElementById('info');

        // 检查认证状态并加载角色列表
        window.addEventListener('load', function() {
            token = localStorage.getItem('token');
            userId = localStorage.getItem('userId');
            const username = localStorage.getItem('username');

            if (!token || !userId) {
                // 未登陆，重定向到登陆页面
                window.location.href = '/index.html';
            } else {
                // 显示用户信息
                document.getElementById('username').textContent = username || '用户';
                // 加载角色列表
                loadPersonas();
            }
        });

        function logout() {
            if (confirm('确定要登出吗？')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userId');
                localStorage.removeItem('username');
                window.location.href = '/index.html';
            }
        }

        // ============== 角色管理函数 ==============

        /**
         * 加载所有可用的角色列表
         */
        function loadPersonas() {
            fetch('/api/conversation/personas', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.personas) {
                    personas = data.personas;
                    const personaSelect = document.getElementById('personaSelect');
                    personaSelect.innerHTML = '';

                    // 添加所有角色到下拉菜单
                    personas.forEach(persona => {
                        const option = document.createElement('option');
                        option.value = persona.id;
                        option.textContent = persona.emoji + ' ' + persona.name;
                        personaSelect.appendChild(option);
                    });

                    // 设置默认选中
                    personaSelect.value = data.currentPersona || 'assistant';
                    currentPersonaId = personaSelect.value;
                    updatePersonaInfo();
                }
            })
            .catch(error => {
                console.error('加载角色列表失败:', error);
            });
        }

        /**
         * 切换角色
         */
        function switchPersona() {
            const personaSelect = document.getElementById('personaSelect');
            const newPersonaId = personaSelect.value;

            if (newPersonaId === currentPersonaId) {
                return;
            }

            // 向服务器发送角色切换请求
            fetch('/api/conversation/personas/' + newPersonaId + '/select', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentPersonaId = newPersonaId;
                    updatePersonaInfo();
                    console.log('角色已切换至:', newPersonaId);

                    // 添加系统消息提示
                    const persona = personas.find(p => p.id === newPersonaId);
                    if (persona) {
                        addMessage('🎭 **角色已切换**\n\n当前角色: ' + persona.emoji + ' ' + persona.name + '\n\n' + persona.description, false);
                    }
                }
            })
            .catch(error => {
                console.error('切换角色失败:', error);
                // 恢复到前一个选择
                personaSelect.value = currentPersonaId;
            });
        }

        /**
         * 更新角色信息显示
         */
        function updatePersonaInfo() {
            const persona = personas.find(p => p.id === currentPersonaId);
            const personaInfo = document.getElementById('personaInfo');

            if (persona) {
                personaInfo.textContent = persona.emoji + ' ' + persona.description;
            } else {
                personaInfo.textContent = '';
            }
        }

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (isUser ? 'user' : 'ai');

            const wrapperDiv = document.createElement('div');
            wrapperDiv.style.display = 'flex';
            wrapperDiv.style.gap = '8px';
            wrapperDiv.style.alignItems = 'flex-start';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (isUser) {
                contentDiv.innerHTML = content; // 允许渲染图片 HTML
            } else {
                contentDiv.innerHTML = marked.parse(content);
            }

            wrapperDiv.appendChild(contentDiv);

            // 为 AI 消息添加语音播放按钮
            if (!isUser) {
                const ttsBtn = document.createElement('button');
                ttsBtn.className = 'tts-btn';
                ttsBtn.innerHTML = '🔊';
                ttsBtn.title = '播放语音';
                ttsBtn.onclick = function() {
                    playAIResponse(contentDiv);
                };
                wrapperDiv.appendChild(ttsBtn);
            }

            messageDiv.appendChild(wrapperDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'loading';
            messageDiv.innerHTML = '<div class="message-content"><span class="loading"></span>思考中...</div>';
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingDiv = document.getElementById('loading');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        let currentImageBase64 = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = currentImageBase64;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message && !currentImageBase64) return;

            // 显示用户消息
            let userMessageHtml = message;
            if (currentImageBase64) {
                userMessageHtml += `<br><img src="${currentImageBase64}" style="max-height: 150px; border-radius: 8px; margin-top: 10px;">`;
            }
            addMessage(userMessageHtml, true);

            messageInput.value = '';
            const imageToSend = currentImageBase64;
            removeImage(); // 发送后清空图片

            // 检测是否是图片生成任务
            const isImageGenerationTask = message && (
                message.includes('生成') || message.includes('画') ||
                message.includes('图片') || message.includes('绘制') ||
                message.includes('create') || message.includes('draw') ||
                message.includes('generate')
            );

            // 创建一个空的 AI 消息框，用于流式追加内容
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';

            // 创建 wrapper 用于容纳内容和 TTS 按钮
            const wrapperDiv = document.createElement('div');
            wrapperDiv.style.display = 'flex';
            wrapperDiv.style.gap = '8px';
            wrapperDiv.style.alignItems = 'flex-start';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 根据任务类型显示不同的加载提示
            if (isImageGenerationTask) {
                contentDiv.innerHTML = '<span class="loading"></span><strong>🎨 正在生成图片中...</strong><br><span style="font-size: 13px; color: #999;">这可能需要 15-30 秒，请稍候</span>';
            } else {
                contentDiv.innerHTML = '<span class="loading"></span>思考中...';
            }

            wrapperDiv.appendChild(contentDiv);

            // 添加 TTS 按钮
            const ttsBtn = document.createElement('button');
            ttsBtn.className = 'tts-btn';
            ttsBtn.innerHTML = '🔊';
            ttsBtn.title = '播放语音';
            ttsBtn.onclick = function() {
                playAIResponse(contentDiv);
            };
            wrapperDiv.appendChild(ttsBtn);

            messageDiv.appendChild(wrapperDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            // 存储任务类型供后续使用
            contentDiv.dataset.isImageTask = isImageGenerationTask;

            try {
                const response = await fetch('/api/conversation/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        message: message || "请描述这张图片",
                        sessionId: sessionId,
                        imageBase64: imageToSend,
                        personaId: currentPersonaId  // 添加角色 ID
                    })
                });

                if (response.status === 401) {
                    contentDiv.innerHTML = '❌ 认证失败，请重新登陆';
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 移除 loading 状态，准备接收文本
                contentDiv.innerHTML = '';

                // 读取流式数据
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let done = false;
                let buffer = '';

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });

                        // SSE 事件以 \n\n 分隔
                        let eventEndIndex;
                        while ((eventEndIndex = buffer.indexOf('\n\n')) >= 0) {
                            const eventString = buffer.substring(0, eventEndIndex);
                            buffer = buffer.substring(eventEndIndex + 2);

                            const lines = eventString.split('\n');
                            let currentEvent = 'message'; // 默认事件类型
                            let data = '';

                            for (const line of lines) {
                                if (line.startsWith('event:')) {
                                    currentEvent = line.substring(6).trim();
                                } else if (line.startsWith('data:')) {
                                    data = line.substring(5).trim();
                                }
                            }

                            if (data) {
                                if (currentEvent === 'session') {
                                    sessionId = data;
                                    info.textContent = '会话 ID: ' + sessionId.substring(0, 8) + '...';
                                } else if (currentEvent === 'message') {
                                    if (data === 'done') {
                                        // 移除状态容器（完成后不再显示进度）
                                        if (contentDiv.statusContainer) {
                                            contentDiv.statusContainer.remove();
                                            contentDiv.statusContainer = null;
                                        }
                                        continue;
                                    }
                                    try {
                                        const parsed = JSON.parse(data);
                                        // 累加原始文本，防止 null 被拼接成字符串 "null"
                                        if (parsed.text && parsed.text !== 'null') {
                                            if (!contentDiv.dataset.rawText) {
                                                contentDiv.dataset.rawText = '';
                                                // 第一次收到内容时，如果还显示着 loading，则清除
                                                if (contentDiv.innerHTML.includes('思考中') || contentDiv.innerHTML.includes('生成图片中')) {
                                                    contentDiv.innerHTML = '';
                                                    contentDiv.dataset.rawText = '';
                                                }
                                            }
                                            contentDiv.dataset.rawText += parsed.text;
                                            // 使用 marked 渲染 Markdown
                                            let renderedHtml = marked.parse(contentDiv.dataset.rawText);

                                            // 如果还有状态容器，保留它在上面
                                            if (contentDiv.statusContainer) {
                                                contentDiv.innerHTML = '';
                                                contentDiv.appendChild(contentDiv.statusContainer);
                                                const contentArea = document.createElement('div');
                                                contentArea.innerHTML = renderedHtml;
                                                contentDiv.appendChild(contentArea);
                                            } else {
                                                contentDiv.innerHTML = renderedHtml;
                                            }
                                            chatArea.scrollTop = chatArea.scrollHeight;
                                        }
                                    } catch (e) {
                                        console.error('解析消息失败:', data, e);
                                    }
                                } else if (currentEvent === 'status') {
                                    try {
                                        const parsed = JSON.parse(data);
                                        if (parsed.status) {
                                            // 在消息框中显示进度状态
                                            if (!contentDiv.statusContainer) {
                                                contentDiv.statusContainer = document.createElement('div');
                                                contentDiv.statusContainer.style.fontSize = '13px';
                                                contentDiv.statusContainer.style.color = '#666';
                                                contentDiv.statusContainer.style.fontStyle = 'italic';
                                                contentDiv.statusContainer.style.marginBottom = '8px';
                                                contentDiv.statusContainer.style.padding = '8px';
                                                contentDiv.statusContainer.style.backgroundColor = '#f5f5f5';
                                                contentDiv.statusContainer.style.borderRadius = '4px';
                                                contentDiv.statusContainer.style.borderLeft = '3px solid #667eea';
                                                contentDiv.appendChild(contentDiv.statusContainer);
                                            }
                                            contentDiv.statusContainer.innerHTML = `<span class="loading" style="width:14px; height:14px; margin-right:5px;"></span>⏳ ${parsed.status}`;
                                            chatArea.scrollTop = chatArea.scrollHeight;
                                        }
                                    } catch (e) {
                                        console.error('解析状态失败:', data, e);
                                    }
                                } else if (currentEvent === 'error') {
                                    contentDiv.innerHTML += '<br><span style="color:red">❌ ' + data + '</span>';
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                contentDiv.innerHTML = '❌ 请求失败: ' + error.message;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function clearChat() {
            if (confirm('确定要清空对话吗？')) {
                chatArea.innerHTML = '';
                sessionId = null;
                info.textContent = '会话 ID: 新会话';
                addMessage('✨ 对话已清空，开始新的对话吧！', false);
            }
        }

        // ============== 语音识别 (ASR) 逻辑 ==============
        let recognition = null;
        let isRecording = false;

        // 初始化语音识别
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('您的浏览器不支持语音识别功能。请使用 Chrome、Edge 等现代浏览器。');
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN'; // 设置为中文
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isRecording = true;
                const voiceBtn = document.getElementById('voiceBtn');
                voiceBtn.classList.add('recording');
                document.getElementById('voiceStatus').innerHTML = '<span class="voice-indicator"></span>正在听...';
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        messageInput.value += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                if (interimTranscript) {
                    messageInput.value = messageInput.value + interimTranscript;
                    messageInput.placeholder = '识别中...';
                }
            };

            recognition.onerror = function(event) {
                console.error('语音识别错误:', event.error);
                alert('语音识别错误: ' + event.error);
            };

            recognition.onend = function() {
                isRecording = false;
                const voiceBtn = document.getElementById('voiceBtn');
                voiceBtn.classList.remove('recording');
                document.getElementById('voiceStatus').textContent = '说话';
                messageInput.placeholder = '输入消息或点击🎤说话...';
            };

            return true;
        }

        // 切换语音输入
        function toggleVoiceInput() {
            if (!recognition && !initSpeechRecognition()) {
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                messageInput.value = '';
                recognition.start();
            }
        }

        // ============== 文字转语音 (TTS) 逻辑 ==============
        let currentAudio = null;

        function playAIResponse(contentDiv) {
            // 获取内容，可能是 contentDiv 或直接是文本字符串
            let text;
            if (typeof contentDiv === 'string') {
                text = contentDiv;
            } else if (contentDiv && contentDiv.nodeType === 1) {
                // 获取元素的纯文本，排除 HTML 标签
                text = contentDiv.innerText || contentDiv.textContent || '';
            } else {
                text = String(contentDiv || '');
            }

            // 移除空白字符并截取前 500 个字符
            text = text.trim().substring(0, 500);

            if (!text) {
                alert('没有内容可播放');
                return;
            }

            // 使用浏览器原生 TTS
            if ('speechSynthesis' in window) {
                // 停止当前播放
                if (currentAudio) {
                    speechSynthesis.cancel();
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1;
                utterance.pitch = 1;
                utterance.volume = 1;

                utterance.onstart = function() {
                    console.log('开始播放语音:', text.substring(0, 50));
                };

                utterance.onend = function() {
                    console.log('语音播放完成');
                    currentAudio = null;
                };

                utterance.onerror = function(event) {
                    console.error('语音播放错误:', event.error);
                    alert('语音播放失败: ' + event.error);
                };

                currentAudio = utterance;
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持文字转语音功能');
            }
        }

        // ============== RAG 功能逻辑 ==============
        let ragEnabled = false;

        /**
         * 切换 RAG 功能
         */
        function toggleRag() {
            if (!sessionId) {
                alert('请先发送一条消息创建会话');
                return;
            }

            ragEnabled = !ragEnabled;
            const toggle = document.getElementById('ragToggle');
            if (ragEnabled) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }

            // 向后端发送 RAG 切换请求
            fetch('/api/conversation/rag/' + sessionId + '/toggle?enabled=' + ragEnabled, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const message = ragEnabled ?
                        '✅ RAG 已启用！现在我会使用已上传的文档来增强回答。' :
                        '❌ RAG 已禁用。我将回到标准对话模式。';
                    addMessage(message, false);
                    console.log('RAG 状态:', ragEnabled);
                }
            })
            .catch(error => {
                console.error('切换 RAG 失败:', error);
                ragEnabled = !ragEnabled;
                toggle.classList.toggle('active');
            });
        }

        /**
         * 打开文档管理模态框
         */
        function openDocModal() {
            document.getElementById('docModal').classList.add('show');
            loadDocuments();
        }

        /**
         * 关闭文档管理模态框
         */
        function closeDocModal() {
            document.getElementById('docModal').classList.remove('show');
        }

        /**
         * 加载已上传的文档列表
         */
        function loadDocuments() {
            fetch('/api/documents/list', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-User-Id': userId
                }
            })
            .then(response => response.json())
            .then(data => {
                const docList = document.getElementById('docList');
                if (data.status === 'success' && data.documents) {
                    if (data.documents.length === 0) {
                        docList.innerHTML = '<p style="text-align: center; color: #999; font-size: 13px; padding: 20px;">还没有上传任何文档</p>';
                    } else {
                        docList.innerHTML = '';
                        data.documents.forEach(doc => {
                            const docItem = document.createElement('div');
                            docItem.className = 'doc-item';
                            const sizeKB = (doc.size / 1024).toFixed(2);
                            docItem.innerHTML = `
                                <span class="doc-item-name">${doc.name}</span>
                                <span class="doc-item-size">${sizeKB} KB</span>
                                <button class="doc-delete-btn" onclick="deleteDocument('${doc.id}')">删除</button>
                            `;
                            docList.appendChild(docItem);
                        });
                    }
                }
            })
            .catch(error => {
                console.error('加载文档列表失败:', error);
                document.getElementById('docList').innerHTML = '<p style="color: red;">加载失败</p>';
            });
        }

        /**
         * 处理文档上传
         */
        function handleDocUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 验证文件类型
            const validTypes = ['application/pdf', 'text/plain', 'text/markdown'];
            const validExtensions = ['.pdf', '.txt', '.md', '.markdown'];
            const fileName = file.name.toLowerCase();
            const fileExtValid = validExtensions.some(ext => fileName.endsWith(ext));

            if (!fileExtValid) {
                alert('不支持的文件类型，请上传 PDF、TXT 或 Markdown 文件');
                event.target.value = '';
                return;
            }

            // 验证文件大小 (10MB)
            if (file.size > 10 * 1024 * 1024) {
                alert('文件过大，最大支持 10MB');
                event.target.value = '';
                return;
            }

            // 创建 FormData 上传
            const formData = new FormData();
            formData.append('file', file);

            // 获取 label 元素（上传按钮的容器）
            const uploadLabel = event.target.parentElement;
            const originalText = uploadLabel.textContent;
            uploadLabel.textContent = '📤 上传中...';
            uploadLabel.style.pointerEvents = 'none';
            uploadLabel.style.opacity = '0.6';

            fetch('/api/documents/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-User-Id': userId
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // 恢复按钮状态
                uploadLabel.textContent = originalText;
                uploadLabel.style.pointerEvents = 'auto';
                uploadLabel.style.opacity = '1';

                if (data.status === 'success') {
                    alert('文档上传成功！');
                    event.target.value = '';
                    loadDocuments();
                } else {
                    alert('上传失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                console.error('上传失败:', error);
                // 恢复按钮状态
                uploadLabel.textContent = originalText;
                uploadLabel.style.pointerEvents = 'auto';
                uploadLabel.style.opacity = '1';
                alert('上传失败: ' + error.message);
            });
        }

        /**
         * 删除文档
         */
        function deleteDocument(docId) {
            if (!confirm('确定要删除该文档吗？')) return;

            fetch('/api/documents/' + docId, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-User-Id': userId
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadDocuments();
                    addMessage('✅ 文档已删除，RAG 索引已更新', false);
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                console.error('删除失败:', error);
                alert('删除失败: ' + error.message);
            });
        }

        // 页面加载时初始化语音识别
        window.addEventListener('load', function(e) {
            // ... 现有代码 ...
            initSpeechRecognition();
        }, false);

        // 欢迎消息
        addMessage('👋 你好！我是 AI 助手，可以帮你查询天气、推荐旅游景点。\n\n💡 **新功能**：\n- 🎭 选择不同角色体验不同的对话风格（资深程序员、心理咨询师、英语翻译官等）\n- 📄 **RAG 增强生成**：上传文档后启用 RAG，我会根据文档内容来回答问题\n- 🎤 点击话筒按钮进行语音输入\n- 🔊 点击绿色按钮播放 AI 回复的语音', false);
    </script>
