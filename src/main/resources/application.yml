# 应用配置
app:
  # JWT 配置
  jwt:
    # 密钥（用于签署 JWT Token，至少 512 位）
    secret: ${JWT_SECRET:demo-ai-secret-key-for-jwt-token-generation-very-long-string-to-ensure-512-bits-for-hs512}
    # 过期时间（毫秒，默认 24 小时）
    expiration: ${JWT_EXPIRATION:86400000}

# LangChain4j 配置
langchain4j:
  # 使用的模型提供商：zhipu（智谱AI）或 openai
  provider: ${LANGCHAIN4J_PROVIDER:zhipu}

  # 智谱 AI 配置（推荐使用，有免费额度）
  zhipu:
    # 智谱 AI API Key（从 https://open.bigmodel.cn/ 获取）
    # 使用环境变量：export ZHIPU_API_KEY=your-api-key
    api-key: ${ZHIPU_API_KEY:}
    # 模型名称：glm-4（最新）、glm-4-flash（快速）、glm-3-turbo
    model-name: ${ZHIPU_MODEL:glm-4-flash}
    temperature: ${ZHIPU_TEMPERATURE:0.7}
    max-tokens: ${ZHIPU_MAX_TOKENS:1000}
    timeout: ${ZHIPU_TIMEOUT:60}

  # OpenAI 配置（如需使用 OpenAI，请配置此项）
  openai:
    # OpenAI API Key
    api-key: ${OPENAI_API_KEY:your-api-key-here}
    # 模型名称
    model-name: ${OPENAI_MODEL:gpt-3.5-turbo}
    # 温度参数（0-1，越高越随机）
    temperature: ${OPENAI_TEMPERATURE:0.7}
    # 最大 tokens 数
    max-tokens: ${OPENAI_MAX_TOKENS:1000}
    # 超时时间（秒）
    timeout: ${OPENAI_TIMEOUT:60}

# 天气服务配置
weather:
  # 心知天气 API Key（从 https://www.seniverse.com/ 获取）
  # 使用环境变量：export SENIVERSE_API_KEY=your-api-key
  api-key: ${SENIVERSE_API_KEY:}
  # 默认城市（可选）
  default-city: ${WEATHER_DEFAULT_CITY:北京}

  # 和风天气 API Key（从 https://dev.qweather.com/ 获取，推荐使用）
  # 使用环境变量：export QWEATHER_API_KEY=your-api-key
  qweather-api-key: ${QWEATHER_API_KEY:}

# 地图服务配置（高德地图）
map:
  # 高德地图 API Key（从 https://console.amap.com/ 获取）
  # 使用环境变量：export AMAP_API_KEY=your-api-key
  api-key: ${AMAP_API_KEY:}

# 服务配置
server:
  port: 8080
  # Tomcat 编码配置
  tomcat:
    uri-encoding: UTF-8

# Spring 配置
spring:
  # HTTP 编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

